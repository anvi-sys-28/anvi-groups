<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stop Digging Through Dashboards</title>
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <script>
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('motion-pending');
      window.__motionTimeout = setTimeout(function() {
        document.documentElement.classList.remove('motion-pending');
      }, 3500);
    }
  </script>
  <style>
    @font-face {
      font-family: "Reference Sans";
      src: local("Reference Sans"), local("ReferenceSans"),
           url("https://fonts.cdnfonts.com/s/93132/ReferenceSans-Variable.woff2") format("woff2-variations"),
           url("https://fonts.cdnfonts.com/s/93132/ReferenceSans-Variable.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Reference Display";
      src: local("Reference Display"), local("ReferenceDisplay"),
           url("https://fonts.cdnfonts.com/s/93132/ReferenceDisplay-Variable.woff2") format("woff2-variations"),
           url("https://fonts.cdnfonts.com/s/93132/ReferenceDisplay-Variable.woff2") format("woff2");
      font-weight: 400 900;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      width: 100%;
      height: 100%;
      color-scheme: dark;
    }

    :root {
      font-family: "Reference Sans", Arial, sans-serif;
      color-scheme: dark;
    }

    .viewport {
      position: fixed;
      inset: 0;
      isolation: isolate;
      background: #000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .screen {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;

      --gutter-start: clamp(36px, 4.177vw, 96px);
      --gutter-end: clamp(36px, 4.04vw, 96px);
      --header-top: clamp(20px, 2.264vh, 30px);
      --hero-bottom: clamp(34px, 5.19vh, 64px);
      --display-size: clamp(58px, 7.64vh, 88px);
      --display-leading: clamp(72px, 9.34vh, 106px);
      --copy-size: clamp(14px, 1.70vh, 19px);
      --copy-leading: clamp(19px, 2.17vh, 24px);
      --title-copy-gap: clamp(15px, 2.08vh, 24px);
      --copy-cta-gap: clamp(24px, 3.11vh, 36px);
      --cta-width: clamp(142px, 15.09vh, 168px);
      --cta-height: clamp(38px, 3.96vh, 44px);
      --compact-control-font-size: clamp(17px, 1.75vh, 19px);
      --action-control-font-size: clamp(17px, 1.78vh, 19.5px);
      --primary-control-font-size: clamp(17px, 1.77vh, 19.25px);
      --control-inline-nudge: -1px;
      --control-baseline-shift: clamp(1px, .19vh, 2px);
      --copy-optical-shift: clamp(0px, .1vh, 1px);
      --watch-baseline-shift: clamp(2px, .38vh, 4px);
      --card-width: clamp(150px, 18.96vh, 215px);
    }

    .background {
      position: absolute;
      inset: 0;
      z-index: -3;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
      user-select: none;
    }

    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(180deg, rgba(0,0,0,.03), transparent 24%, transparent 82%, rgba(0,0,0,.05)),
        radial-gradient(ellipse at 44% 54%, transparent 30%, rgba(0,0,0,.055) 100%);
      pointer-events: none;
    }

    .header {
      position: absolute;
      inset: var(--header-top) var(--gutter-end) auto var(--gutter-start);
      height: 48px;
      display: flex;
      align-items: flex-start;
      white-space: nowrap;
      z-index: 10;
    }

    .brand {
      position: relative;
      top: 10px;
      display: inline-block;
      text-decoration: none;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.3));
    }

    .brand-icon {
      display: block;
      width: 25px;
      height: 25px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      width: 100%;
    }

    .nav {
      margin-left: clamp(36px, 3.03vw, 48px);
      display: flex;
      align-items: center;
      gap: clamp(32px, 2.9vw, 43px);
      position: relative;
      top: 9px;
    }

    .nav a {
      font-size: 16px;
      font-weight: 430;
      letter-spacing: -.36px;
      color: rgba(229,229,230,.77);
      text-shadow: 0 1px 3px rgba(0,0,0,.55);
      text-decoration: none;
      position: relative;
    }

    .nav a:first-child {
      position: relative;
      top: -3px;
    }

    .nav a:nth-child(4) {
      margin-left: 1px;
    }

    .nav a.active {
      color: #fff;
    }

    .nav a.active::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 44px;
      height: 2px;
      background: rgba(255,255,255,.82);
      border-radius: 1px;
    }

    .time-panel {
      margin-left: auto;
      width: 211px;
      height: 48px;
      padding-left: 8px;
      border-left: 2px solid rgba(230,230,230,.52);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .time-panel label {
      font-size: 15px;
      font-weight: 420;
      color: rgba(240,240,240,.77);
      line-height: 1.2;
    }

    .time-panel span {
      font-size: 15px;
      font-weight: 440;
      color: rgba(255,255,255,.93);
      line-height: 1.2;
    }

    .sign-up {
      width: 109px;
      height: 42px;
      border-radius: 7px;
      background: #fff;
      color: #101010;
      font-weight: 460;
      font-size: var(--action-control-font-size);
      letter-spacing: -.34px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.72), 0 1px 5px rgba(0,0,0,.34);
      margin-left: clamp(20px, 1.95vw, 29px);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .menu-toggle {
      display: none;
    }

    .hero {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .hero-content {
      position: absolute;
      left: var(--gutter-start);
      bottom: var(--hero-bottom);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      z-index: 5;
      pointer-events: auto;
    }

    .hero-title {
      margin: 0;
      padding: 0;
      font-family: "Reference Display", "Reference Sans", Arial, sans-serif;
      font-weight: 500;
      font-size: var(--display-size);
      line-height: var(--display-leading);
      font-optical-sizing: auto;
      letter-spacing: -2.1px;
      -webkit-text-stroke: .12px currentColor;
      white-space: nowrap;
      text-shadow: 0 2px 2px rgba(0,0,0,.44);
    }

    .line {
      display: block;
      overflow: hidden;
      transform-origin: left center;
    }

    .line-one {
      color: #fff;
      transform: scaleX(.775);
    }

    .line-two {
      color: rgba(211, 207, 207, .78);
      transform: scaleX(.793);
    }

    .line-reveal {
      display: inline-block;
      will-change: transform;
    }

    .hero-copy {
      margin: var(--title-copy-gap) 0 var(--copy-cta-gap) 0;
      color: rgba(226, 229, 228, .84);
      font-weight: 350;
      font-size: var(--copy-size);
      line-height: var(--copy-leading);
      letter-spacing: .13px;
      width: clamp(390px, 31.67vw, 500px);
      position: relative;
      left: 1px;
      text-shadow: 0 1px 3px rgba(0,0,0,.7);
    }

    .primary-cta {
      width: var(--cta-width);
      height: var(--cta-height);
      border-radius: 7px;
      background: #fff;
      color: #111;
      box-shadow: 0 1px 5px rgba(0,0,0,.38);
      position: relative;
      display: flex;
      align-items: center;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .primary-cta .label {
      position: absolute;
      left: 8.125%;
      font-size: var(--primary-control-font-size);
      font-weight: 450;
      letter-spacing: -.3px;
      color: #111;
    }

    .primary-cta .arrow-box {
      position: absolute;
      right: 3.125%;
      top: 14.286%;
      width: 20.625%;
      height: 71.429%;
      border-radius: 7px;
      background: #070909;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .demo-card {
      position: absolute;
      right: var(--gutter-end);
      bottom: var(--hero-bottom);
      width: var(--card-width);
      aspect-ratio: 201 / 265;
      container-type: inline-size;
      z-index: 5;
      pointer-events: auto;

      border: 1px solid rgba(255,255,255,.13);
      border-radius: clamp(12px, 1.52vh, 18px);
      background: linear-gradient(145deg, rgba(24,22,20,.80), rgba(5,12,14,.86));
      box-shadow:
        0 2px 10px rgba(0,0,0,.44),
        0 0 0 3px rgba(255,255,255,.035) inset,
        0 0 0 1px rgba(0,0,0,.9);
      backdrop-filter: blur(14px) saturate(108%);
      -webkit-backdrop-filter: blur(14px) saturate(108%);
      display: flex;
      flex-direction: column;
    }

    .demo-visual {
      position: relative;
      margin: 4cqw 3.5cqw 0 3.5cqw;
      width: 92.5cqw;
      aspect-ratio: 1;
      border-radius: 4cqw;
      background: #101a1e;
      overflow: hidden;
    }

    .demo-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(.89) saturate(.93) contrast(1.03);
      display: block;
    }

    .demo-visual .play {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 29cqw;
      height: 29cqw;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.34);
      background: rgba(3,5,7,.47);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .watch-button {
      margin: 3.5cqw;
      width: calc(100% - 7cqw);
      height: 22cqw;
      border-radius: 3.5cqw;
      background: linear-gradient(145deg, rgba(26,34,36,.86), rgba(16,29,33,.9));
      border: 1px solid rgba(255,255,255,.21);
      color: #fff;
      font-weight: 430;
      font-size: clamp(12px, 7cqw, 15px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    @keyframes entrance-brand {
      0% { opacity: 0; transform: translateY(7px) scale(0.94); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes entrance-nav {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes entrance-action {
      0% { opacity: 0; transform: translateY(8px) scale(0.985); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes entrance-line {
      0% { transform: translate3d(0, 110%, 0) skewY(2deg); }
      100% { transform: translate3d(0, 0, 0) skewY(0deg); }
    }

    @keyframes entrance-copy {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes entrance-card {
      0% { opacity: 0; transform: translateY(12px) scale(0.968); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    html.motion-pending .brand {
      opacity: 0;
      animation: entrance-brand 580ms cubic-bezier(.16,1,.3,1) 60ms forwards;
    }

    html.motion-pending .nav a:nth-child(1) {
      opacity: 0;
      animation: entrance-nav 480ms cubic-bezier(.16,1,.3,1) 130ms forwards;
    }

    html.motion-pending .nav a:nth-child(2) {
      opacity: 0;
      animation: entrance-nav 480ms cubic-bezier(.16,1,.3,1) 175ms forwards;
    }

    html.motion-pending .nav a:nth-child(3) {
      opacity: 0;
      animation: entrance-nav 480ms cubic-bezier(.16,1,.3,1) 220ms forwards;
    }

    html.motion-pending .nav a:nth-child(4) {
      opacity: 0;
      animation: entrance-nav 480ms cubic-bezier(.16,1,.3,1) 265ms forwards;
    }

    html.motion-pending .time-panel {
      opacity: 0;
      animation: entrance-nav 520ms cubic-bezier(.16,1,.3,1) 180ms forwards;
    }

    html.motion-pending .sign-up {
      opacity: 0;
      animation: entrance-action 520ms cubic-bezier(.16,1,.3,1) 220ms forwards;
    }

    html.motion-pending .menu-toggle {
      opacity: 0;
      animation: entrance-action 520ms cubic-bezier(.16,1,.3,1) 140ms forwards;
    }

    html.motion-pending .line-one .line-reveal {
      transform: translate3d(0,110%,0) skewY(2deg);
      animation: entrance-line 800ms cubic-bezier(.22,1,.36,1) 300ms forwards;
    }

    html.motion-pending .line-two .line-reveal {
      transform: translate3d(0,110%,0) skewY(2deg);
      animation: entrance-line 850ms cubic-bezier(.22,1,.36,1) 440ms forwards;
    }

    html.motion-pending .hero-copy {
      opacity: 0;
      animation: entrance-copy 620ms cubic-bezier(.16,1,.3,1) 740ms forwards;
    }

    html.motion-pending .primary-cta {
      opacity: 0;
      animation: entrance-action 560ms cubic-bezier(.16,1,.3,1) 960ms forwards;
    }

    html.motion-pending .demo-card {
      opacity: 0;
      transform-origin: 82% 50%;
      animation: entrance-card 920ms cubic-bezier(.22,1,.36,1) 1040ms forwards;
    }

    @media (prefers-reduced-motion: no-preference) {
      button, a {
        transition: filter 140ms ease, opacity 140ms ease;
      }
      button:hover, a:hover {
        filter: brightness(1.08);
      }
    }

    button:focus-visible, a:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    /* Tablet Responsive */
    @media (min-width: 620px) and (max-width: 790px),
           (min-width: 620px) and (max-width: 1100px) and (orientation: portrait) {
      .menu-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 46px;
        border-radius: 11px;
        background: rgba(24, 22, 20, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        margin-left: auto;
        cursor: pointer;
        color: #fff;
        padding: 0;
      }

      .header-actions {
        position: absolute;
        top: calc(100% + 12px);
        right: 0;
        width: min(324px, calc(100vw - 2 * var(--gutter-start)));
        background: linear-gradient(145deg, rgba(24,22,20,.92), rgba(5,12,14,.95));
        border: 1px solid rgba(255,255,255,.18);
        border-radius: 16px;
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        padding: 20px;
        box-shadow: 0 12px 36px rgba(0,0,0,.6);
        flex-direction: column;
        gap: 16px;
        align-items: stretch;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-8px) scale(.985);
        transition: opacity .2s ease, transform .2s ease, visibility .2s ease;
        z-index: 100;
      }

      .header.menu-open .header-actions {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
      }

      .nav {
        margin-left: 0;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
        top: 0;
      }

      .nav a.active::after {
        display: none;
      }

      .time-panel {
        width: 100%;
        margin-left: 0;
        border-left: none;
        border-top: 1px solid rgba(230, 230, 230, 0.2);
        padding-left: 0;
        padding-top: 12px;
      }

      .sign-up {
        width: 100%;
        margin-left: 0;
      }
    }

    /* Mobile Responsive */
    @media (max-width: 619px) {
      .screen {
        --gutter-start: 20px;
        --gutter-end: 20px;
      }

      .menu-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 46px;
        border-radius: 11px;
        background: rgba(24, 22, 20, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        margin-left: auto;
        cursor: pointer;
        color: #fff;
        padding: 0;
      }

      .header-actions {
        position: absolute;
        top: calc(100% + 12px);
        right: 0;
        width: min(340px, calc(100vw - 40px));
        background: linear-gradient(145deg, rgba(24,22,20,.92), rgba(5,12,14,.95));
        border: 1px solid rgba(255,255,255,.18);
        border-radius: 16px;
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        padding: 20px;
        box-shadow: 0 12px 36px rgba(0,0,0,.6);
        flex-direction: column;
        gap: 16px;
        align-items: stretch;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-8px) scale(.985);
        transition: opacity .2s ease, transform .2s ease, visibility .2s ease;
        z-index: 100;
      }

      .header.menu-open .header-actions {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
      }

      .nav {
        margin-left: 0;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
        top: 0;
      }

      .nav a.active::after {
        display: none;
      }

      .time-panel {
        width: 100%;
        margin-left: 0;
        border-left: none;
        border-top: 1px solid rgba(230, 230, 230, 0.2);
        padding-left: 0;
        padding-top: 12px;
      }

      .sign-up {
        width: 100%;
        margin-left: 0;
      }

      .line-one {
        transform: scaleX(.78);
      }

      .line-two {
        transform: scaleX(.55);
      }

      .hero-copy br {
        display: none;
      }

      .hero-copy {
        width: 100%;
      }

      .demo-card {
        top: clamp(176px, 32svh, 300px);
        right: var(--gutter-end);
        bottom: auto;
        width: clamp(125px, 35vw, 160px);
      }
    }
  </style>
</head>
<body>
  <main class="viewport">
    <section class="screen" id="screen">
      <video class="background" autoplay muted loop playsinline disablepictureinpicture aria-hidden="true">
        <source src="../public/assets/background.mp4" type="video/mp4">
        <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260808_064556_051587f1-74a1-4336-8c05-4dde3594ed05.mp4" type="video/mp4">
      </video>
      <header class="header">
        <a class="brand" href="#" aria-label="Vantage home">
          <svg width="25" height="25" viewBox="0 0 25 25" fill="none" xmlns="http://www.w3.org/2000/svg" class="brand-icon">
            <g clip-path="url(#vantage-clip)">
              <rect width="25" height="25" fill="#ededed" />
              <path d="M 12.5,2 L 23,12.5 L 12.5,23 L 2,12.5 Z" fill="#050606" />
              <path d="M 12.5,2 L 23,12.5 L 12.5,12.5 Z" fill="#737778" />
              <path d="M 12.5,12.5 L 23,12.5 L 12.5,23 Z" fill="#fafafa" />
              <path d="M 2,12.5 L 12.5,12.5 L 12.5,23 Z" fill="#0a0b0b" />
            </g>
            <defs>
              <clipPath id="vantage-clip">
                <circle cx="12.5" cy="12.5" r="12.5" />
              </clipPath>
            </defs>
          </svg>
        </a>
        <div class="header-actions" id="tablet-navigation" aria-hidden="true">
          <nav class="nav">
            <a href="#" class="active">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
          </nav>
          <div class="time-panel">
            <label>Timezone</label>
            <span>9:47 PM&nbsp; • &nbsp;14 July 2026</span>
          </div>
          <button class="sign-up">Sign Up</button>
        </div>
        <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">
          <svg class="hamburger-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <line x1="3" y1="7" x2="17" y2="7" />
            <line x1="3" y1="13" x2="17" y2="13" />
          </svg>
        </button>
      </header>
      <section class="hero">
        <div class="hero-content">
          <h1 class="hero-title">
            <span class="line line-one"><span class="line-reveal">Stop Digging</span></span>
            <span class="line line-two"><span class="line-reveal">Through Dashboards.</span></span>
          </h1>
          <p class="hero-copy">
            Your metrics are scattered across a dozen dashboards.<br>
            Vantage bring them into one clear signal, so every<br>
            decision is backed by data you actually trust.
          </p>
          <button class="primary-cta">
            <span class="label">Get Started</span>
            <span class="arrow-box">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.5 7h9M8 3.5L11.5 7 8 10.5"/>
              </svg>
            </span>
          </button>
        </div>
        <article class="demo-card">
          <div class="demo-visual">
            <img src="/assets/watch-demo-thumbnail.svg" alt="Abstract red and blue smoke">
            <button class="play" aria-label="Play demo">
              <svg width="12" height="14" viewBox="0 0 12 14" fill="#fff">
                <path d="M1.5 1.5l9 5.5-9 5.5v-11z"/>
              </svg>
            </button>
          </div>
          <button class="watch-button">Watch Demo</button>
        </article>
      </section>
    </section>
  </main>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var header = document.querySelector('.header');
      var toggle = document.querySelector('.menu-toggle');
      var actions = document.querySelector('.header-actions');
      var demoCard = document.querySelector('.demo-card');

      if (demoCard) {
        demoCard.addEventListener('animationend', function(e) {
          if (e.animationName === 'entrance-card' || e.target === demoCard) {
            document.documentElement.classList.remove('motion-pending');
            if (window.__motionTimeout) clearTimeout(window.__motionTimeout);
          }
        });
      }

      if (toggle && header) {
        toggle.addEventListener('click', function() {
          var isOpen = header.classList.toggle('menu-open');
          toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
          actions.setAttribute('aria-hidden', isOpen ? 'false' : 'true');
        });
      }

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && header && header.classList.contains('menu-open')) {
          header.classList.remove('menu-open');
          if (toggle) toggle.setAttribute('aria-expanded', 'false');
          if (actions) actions.setAttribute('aria-hidden', 'true');
          if (toggle) toggle.focus();
        }
      });

      document.addEventListener('pointerdown', function(e) {
        if (header && header.classList.contains('menu-open') && !header.contains(e.target)) {
          header.classList.remove('menu-open');
          if (toggle) toggle.setAttribute('aria-expanded', 'false');
          if (actions) actions.setAttribute('aria-hidden', 'true');
        }
      });
    });
  </script>
</body>
</html>
