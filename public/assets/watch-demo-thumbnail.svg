<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="redGlow" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff2a5f" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#cc1144" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#101a1e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="70%" cy="65%" r="65%">
      <stop offset="0%" stop-color="#00b4ff" stop-opacity="0.8"/>
      <stop offset="55%" stop-color="#0044aa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#101a1e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a020f0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#101a1e" stop-opacity="0"/>
    </radialGradient>
    <filter id="smokeBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" />
    </filter>
    <filter id="fineSmoke" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="35" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  
  <!-- Base background -->
  <rect width="400" height="400" fill="#0c1216"/>

  <g filter="url(#smokeBlur)">
    <!-- Red smoke cloud -->
    <ellipse cx="140" cy="160" rx="130" ry="110" fill="url(#redGlow)" />
    <!-- Blue smoke cloud -->
    <ellipse cx="270" cy="250" rx="140" ry="120" fill="url(#blueGlow)" />
    <!-- Deep purple core -->
    <circle cx="210" cy="200" r="90" fill="url(#purpleGlow)" />
  </g>

  <!-- Distorted smoke overlay -->
  <g filter="url(#fineSmoke)" opacity="0.65">
    <path d="M 50,200 Q 150,80 250,180 T 350,300" fill="none" stroke="#ff3b6b" stroke-width="60" opacity="0.5" />
    <path d="M 100,300 Q 200,350 300,220 T 380,100" fill="none" stroke="#00c8ff" stroke-width="70" opacity="0.5" />
  </g>
</svg>
